steps:
  - name: 'python:3.11'
    entrypoint: bash
    args: ['-c', 'pip install -r requirements.txt && pytest -q tests']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
substitutions:
  _IMAGE: 'us-central1-docker.pkg.dev/$PROJECT_ID/assistant/assistant:$SHORT_SHA'
